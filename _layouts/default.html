<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
  {% assign og_img = site.og_image | default: "/assets/ogp.png" %}

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}" />
  <meta property="og:image" content="{{ og_img | absolute_url }}" />
  <meta property="og:locale" content="ja_JP" />

  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon-v3.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32-v3.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192-v3.png' | relative_url }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kondo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}?v=4">
  <meta name="theme-color" content="#f4f6f2">

  {% include head.html %}
  <link rel="stylesheet" href="{{ '/css/lang.css' | relative_url }}" />
  <script>
    try {
      const savedLang = localStorage.getItem('site-lang');
      if (['ja', 'en', 'zh', 'th'].includes(savedLang)) {
        document.documentElement.dataset.lang = savedLang;
        document.documentElement.lang = savedLang === 'zh' ? 'zh-Hant' : savedLang;
      }
    } catch (e) {}
  </script>
</head>
<body>
  {% include nav.html %}

  {% unless page.hero %}
  <header class="header">
    <h1>{{ page.title | default: site.title }}</h1>
    {% if page.header_lead %}
      <p>{{ page.header_lead | newline_to_br }}</p>
    {% endif %}
  </header>
  {% endunless %}

  <main class="container"{% if page.hero %} style="padding-bottom: 2rem;"{% endif %}>
    {{ content }}
  </main>

  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
</body>
</html>
